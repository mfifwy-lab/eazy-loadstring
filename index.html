<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LuaShort — แชร์โค้ด Lua</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2128;
    --border:#30363d; --text:#e6edf3; --muted:#8b949e;
    --accent:#58a6ff; --green:#238636; --red:#f85149;
  }
  html,body{
    background:var(--bg); color:var(--text); min-height:100vh;
    font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;
    line-height:1.5;
  }
  .wrap{max-width:900px; margin:0 auto; padding:60px 20px 60px}
  h1{
    font-size:28px; margin-bottom:6px;
    background:linear-gradient(90deg,#58a6ff,#a371f7,#f0b132);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .sub{color:var(--muted); font-size:14px; margin-bottom:24px}
  .card{
    background:var(--panel); border:1px solid var(--border);
    border-radius:14px; padding:20px; margin-bottom:16px;
  }
  label{display:block; font-size:13px; color:var(--muted); margin-bottom:8px; font-weight:600}
  input[type=text], textarea{
    width:100%; background:#0d1117; color:var(--text);
    border:1px solid var(--border); border-radius:10px;
    padding:12px 14px; font-size:14px; outline:none;
    font-family:inherit; transition:.2s;
  }
  input[type=text]:focus, textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(88,166,255,.15)}
  textarea{
    min-height:220px; resize:vertical;
    font-family:"JetBrains Mono","Fira Code",Consolas,monospace;
    font-size:13px; line-height:1.55;
  }
  .row{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px}
  button.btn{
    border:none; border-radius:10px; padding:12px 20px;
    font-size:14px; font-weight:700; cursor:pointer;
    color:#fff; transition:.18s; font-family:inherit;
  }
  button.btn:active{transform:scale(.97)}
  .btn-primary{background:var(--green)}
  .btn-primary:hover{background:#2ea043}
  .btn-accent{background:#1f6feb}
  .btn-accent:hover{background:#388bfd}
  .btn-gold{background:#9e6a03}
  .btn-gold:hover{background:#bb8009}
  .btn-ghost{background:transparent; border:1px solid var(--border); color:var(--text)}
  .btn-ghost:hover{background:var(--panel2)}
  .btn:disabled{opacity:.5; cursor:not-allowed}
  .result{margin-top:16px; display:none}
  .result.show{display:block}
  .linkBox{
    display:flex; gap:8px; align-items:center;
    background:#0d1117; border:1px dashed var(--accent);
    border-radius:10px; padding:12px 14px; word-break:break-all;
    font-family:Consolas,monospace; font-size:13px; color:var(--accent);
  }
  .linkBox span{flex:1}
  .codeHeader{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:14px}
  .codeHeader h2{font-size:20px}
  .stats{display:flex; gap:14px; font-size:13px; color:var(--muted)}
  .stats b{color:var(--text)}
  pre.code{
    background:#010409; border:1px solid var(--border); border-radius:10px;
    padding:16px; overflow:auto; max-height:360px;
    font-family:"JetBrains Mono",Consolas,monospace;
    font-size:13px; line-height:1.55; color:#c9d1d9;
    white-space:pre; tab-size:2;
  }
  .loadBox{
    margin-top:16px; padding:14px;
    background:#0d1117; border:1px solid var(--green);
    border-radius:10px; display:none;
  }
  .loadBox.show{display:block}
  .loadBox .out{
    font-family:Consolas,monospace; font-size:13px;
    color:#7ee787; word-break:break-all; margin-bottom:10px;
  }
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px);
    background:var(--panel2); border:1px solid var(--border);
    padding:12px 22px; border-radius:10px; font-size:14px;
    opacity:0; transition:.3s; z-index:2000; pointer-events:none;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  .toast.ok{border-color:var(--green); color:#7ee787}
  .toast.err{border-color:var(--red); color:#ff7b72}
  .hidden{display:none !important}
</style>
</head>
<body>

<div class="wrap">
  <h1>LuaShort</h1>
  <p class="sub">วางโค้ด Lua → สร้างลิงค์สั้น → แชร์ให้คนอื่นกด Loadstring (ฟรีทั้งหมด)</p>

  <div class="card">
    <label>📝 โค้ด Lua ของคุณ</label>
    <textarea id="codeInput" placeholder="-- # Roblox Lua Script&#10;local Players = game:GetService(&quot;Players&quot;)&#10;..."></textarea>

    <div class="row">
      <input type="text" id="customName" placeholder="ตั้งชื่อลิงค์ (ไม่ใส่ก็ได้ → สุ่มให้)" style="flex:1; min-width:200px"/>
    </div>

    <div class="row">
      <button class="btn btn-primary" id="genBtn" type="button">🔗 สร้างลิงค์สั้น</button>
      <button class="btn btn-ghost" id="clearBtn" type="button">ล้าง</button>
    </div>

    <div class="result" id="resultBox">
      <label style="margin-top:14px">✅ ลิงค์ของคุณ (ใช้กับ loadstring ได้เลย)</label>
      <div class="linkBox"><span id="shortLink"></span></div>
      <div class="row">
        <button class="btn btn-accent" id="copyLink" type="button">📋 คัดลอกลิงค์</button>
        <button class="btn btn-ghost" id="openLink" type="button">👁 เปิดดูโค้ด</button>
      </div>
    </div>
  </div>

  <div class="card hidden" id="codeCard">
    <div class="codeHeader">
      <h2>📜 โค้ด Lua</h2>
      <div class="stats">
        <span>👁 เปิดดู: <b id="viewCount">0</b></span>
        <span>🆔 <b id="codeId">-</b></span>
      </div>
    </div>

    <pre class="code" id="codeDisplay"></pre>

    <div class="row">
      <button class="btn btn-gold" id="loadstringBtn" type="button">⚡ ทำเป็น Loadstring</button>
      <button class="btn btn-ghost" id="closeCodeBtn" type="button">✕ ปิด</button>
    </div>

    <div class="loadBox" id="loadBox">
      <label>🎯 คัดลอกไปวางใน Executor ได้เลย</label>
      <div class="out" id="loadOut"></div>
      <button class="btn btn-accent" id="copyLoad" type="button">📋 คัดลอก Loadstring</button>
    </div>
  </div>

  <div class="card">
    <label>📊 ลิงค์ทั้งหมดของคุณ</label>
    <div id="myLinks" style="font-size:14px; color:var(--muted)">ยังไม่มีลิงค์</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  /* ---------- Safe Storage ---------- */
  const mem = {};
  function lsGet(k, d){
    try { const v = localStorage.getItem(k); return v === null ? d : v; }
    catch(e){ return mem[k] !== undefined ? mem[k] : d; }
  }
  function lsSet(k, v){
    try { localStorage.setItem(k, v); }
    catch(e){ mem[k] = v; }
  }

  const LS_CODES = 'luashort_codes_v1';

  const Store = {
    getCodes(){
      try { return JSON.parse(lsGet(LS_CODES, '{}')); }
      catch(e){ return {}; }
    },
    setCodes(o){ lsSet(LS_CODES, JSON.stringify(o)); },

    saveCode(id, code, name, rawUrl){
      const all = Store.getCodes();
      all[id] = {
        code, name: name || id, views: 0,
        createdAt: Date.now(), lastVisit: 0, shortUrl: rawUrl
      };
      Store.setCodes(all);
      return all[id];
    },
    getCode(id){ return Store.getCodes()[id] || null; },
    incView(id){
      const all = Store.getCodes();
      if (all[id]){
        all[id].views = (all[id].views||0)+1;
        all[id].lastVisit = Date.now();
        Store.setCodes(all);
      }
    }
  };

  /* ---------- Helpers ---------- */
  function $(id){ return document.getElementById(id); }

  function genId(len){
    len = len || 6;
    const chars = 'abcdefghijkmnpqrstuvwxyz23456789';
    let s = '';
    for (let i = 0; i < len; i++) s += chars[Math.floor(Math.random()*chars.length)];
    return s;
  }

  function toast(msg, type){
    type = type || 'ok';
    const t = $('toast');
    if (!t) return;
    t.textContent = msg;
    t.className = 'toast show ' + type;
    clearTimeout(toast._tid);
    toast._tid = setTimeout(function(){ t.className = 'toast ' + type; }, 2200);
  }

  function copy(text){
    if (!text) return;
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(
        function(){ toast('คัดลอกแล้ว ✅', 'ok'); },
        function(){ fallbackCopy(text); }
      );
    } else {
      fallbackCopy(text);
    }
  }
  function fallbackCopy(text){
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      toast('คัดลอกแล้ว ✅', 'ok');
    } catch(e){
      toast('คัดลอกไม่สำเร็จ ❌', 'err');
    }
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(m){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m];
    });
  }

  /* ---------- Upload Lua ---------- */
  function uploadLua(code){
    return fetch('https://paste.rs/', { method:'POST', body: code })
      .then(function(res){
        if (!res.ok) throw new Error('paste.rs failed');
        return res.text();
      })
      .then(function(txt){
        txt = txt.trim();
        if (/^https?:\/\//i.test(txt)) return txt;
        throw new Error('bad url');
      })
      .catch(function(){
        const form = new URLSearchParams();
        form.append('content', code);
        form.append('format', 'url');
        form.append('expiry_days', '365');
        return fetch('https://dpaste.com/api/v2/', {
          method:'POST',
          headers:{'Content-Type':'application/x-www-form-urlencoded'},
          body: form.toString()
        }).then(function(res){
          if (!res.ok) throw new Error('dpaste failed');
          return res.text();
        }).then(function(txt){
          txt = txt.trim();
          if (/^https?:\/\//i.test(txt)) return txt.replace(/\/+$/, '') + '.txt';
          throw new Error('bad url');
        });
      })
      .catch(function(){
        const form = new FormData();
        form.append('file', new Blob([code], {type:'text/plain'}), 'script.lua');
        return fetch('https://0x0.st', { method:'POST', body: form })
          .then(function(res){
            if (!res.ok) throw new Error('0x0 failed');
            return res.text();
          })
          .then(function(txt){
            txt = txt.trim();
            if (/^https?:\/\//i.test(txt)) return txt;
            throw new Error('bad url');
          });
      })
      .catch(function(){ return null; });
  }

  function tryShorten(url){
    return fetch('https://tinyurl.com/api-create.php?url=' + encodeURIComponent(url))
      .then(function(res){
        if (!res.ok) return url;
        return res.text();
      })
      .then(function(txt){
        txt = (txt||'').trim();
        return txt.startsWith('http') ? txt : url;
      })
      .catch(function(){ return url; });
  }

  /* ---------- Render ---------- */
  function renderMyLinks(){
    const box = $('myLinks');
    if (!box) return;
    const all = Store.getCodes();
    const ids = Object.keys(all).sort(function(a,b){
      return (all[b].createdAt||0)-(all[a].createdAt||0);
    });
    if (!ids.length){ box.innerHTML = 'ยังไม่มีลิงค์'; return; }
    box.innerHTML = ids.map(function(id){
      const c = all[id];
      const url = c.shortUrl || (location.origin + location.pathname + '#c=' + id);
      return '<div style="display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)">'
        + '<div style="min-width:0;flex:1">'
        + '<div style="color:var(--text);font-weight:600">' + escapeHtml(c.name) + '</div>'
        + '<a href="' + escapeHtml(url) + '" target="_blank" rel="noopener" style="color:var(--accent);font-size:12px;word-break:break-all">' + escapeHtml(url) + '</a>'
        + '</div>'
        + '<div style="font-size:12px;color:var(--muted);white-space:nowrap">👁 ' + (c.views||0) + '</div>'
        + '</div>';
    }).join('');
  }

  function showCodeCard(id){
    const entry = Store.getCode(id);
    if (!entry) return;
    $('codeDisplay').textContent = entry.code;
    $('viewCount').textContent = entry.views || 0;
    $('codeId').textContent = id;
    $('loadBox').classList.remove('show');
    $('codeCard').classList.remove('hidden');
    try { $('codeCard').scrollIntoView({behavior:'smooth', block:'start'}); } catch(e){}
  }

  function hideCodeCard(){
    $('codeCard').classList.add('hidden');
    $('loadBox').classList.remove('show');
  }

  /* ---------- Router ---------- */
  function router(){
    const hash = location.hash.slice(1);
    if (hash.indexOf('c=') === 0){
      const id = hash.slice(2);
      const entry = Store.getCode(id);
      if (!entry) return;
      Store.incView(id);
      showCodeCard(id);
      renderMyLinks();
    } else {
      hideCodeCard();
    }
  }

  /* ---------- Actions ---------- */
  function onGen(){
    const code = $('codeInput').value.trim();
    if (!code) return toast('กรุณาใส่โค้ดก่อน ❌', 'err');

    const btn = $('genBtn');
    btn.disabled = true;
    btn.textContent = '⏳ กำลังอัปโหลด...';

    const customName = $('customName').value.trim();
    const id = genId(6);

    uploadLua(code).then(function(rawUrl){
      if (!rawUrl){
        btn.disabled = false;
        btn.textContent = '🔗 สร้างลิงค์สั้น';
        return toast('อัปโหลดไม่สำเร็จ ลองอีกครั้ง ❌', 'err');
      }
      return tryShorten(rawUrl).then(function(shortUrl){
        Store.saveCode(id, code, customName || id, shortUrl);

        $('shortLink').textContent = shortUrl;
        $('resultBox').classList.add('show');
        $('resultBox').dataset.url = shortUrl;
        $('resultBox').dataset.id  = id;

        showCodeCard(id);
        renderMyLinks();

        btn.disabled = false;
        btn.textContent = '🔗 สร้างลิงค์สั้น';
        toast('สร้างลิงค์สำเร็จ 🎉', 'ok');
      });
    }).catch(function(){
      btn.disabled = false;
      btn.textContent = '🔗 สร้างลิงค์สั้น';
      toast('เกิดข้อผิดพลาด ลองอีกครั้ง ❌', 'err');
    });
  }

  function onLoadstring(){
    const id = $('codeId').textContent;
    const entry = Store.getCode(id);
    if (!entry) return toast('ไม่พบโค้ด ❌', 'err');

    const rawUrl = entry.shortUrl || (location.origin + location.pathname + '#c=' + id);
    const loadStr = 'loadstring(game:HttpGet("' + rawUrl + '"))()';

    $('loadOut').textContent = loadStr;
    $('loadBox').classList.add('show');
    toast('สร้าง Loadstring สำเร็จ 🎉', 'ok');
  }

  /* ---------- Init ---------- */
  function bind(id, evt, fn){
    const el = $(id);
    if (el) el.addEventListener(evt, fn);
  }

  function init(){
    try {
      router();
      renderMyLinks();

      bind('genBtn', 'click', onGen);
      bind('clearBtn', 'click', function(){
        $('codeInput').value = '';
        $('customName').value = '';
        $('resultBox').classList.remove('show');
        hideCodeCard();
      });
      bind('copyLink', 'click', function(){
        copy($('resultBox').dataset.url);
      });
      bind('openLink', 'click', function(){
        const id = $('resultBox').dataset.id;
        if (id) showCodeCard(id);
      });
      bind('closeCodeBtn', 'click', hideCodeCard);
      bind('loadstringBtn', 'click', onLoadstring);
      bind('copyLoad', 'click', function(){
        copy($('loadOut').textContent);
      });

    } catch(err){
      console.error('Init error:', err);
      toast('เกิดข้อผิดพลาด: ' + err.message, 'err');
    }
  }

  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  window.addEventListener('hashchange', router);

})();
</script>
</body>
</html>
