<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LuaShort</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2128;
    --border:#30363d; --text:#e6edf3; --muted:#8b949e;
    --accent:#58a6ff; --green:#238636; --red:#f85149; --gold:#f0b132;
  }
  html,body{background:var(--bg);color:var(--text);min-height:100vh;
    font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;line-height:1.5}
  .topbar{position:fixed;top:0;left:0;right:0;height:56px;
    background:rgba(13,17,23,.9);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);display:flex;align-items:center;
    justify-content:space-between;padding:0 18px;z-index:100}
  .topbar .brand{font-weight:800;font-size:15px}
  .topbar .brand span{background:linear-gradient(90deg,#58a6ff,#a371f7);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  #settingsBtn{width:40px;height:40px;border-radius:10px;background:var(--panel);
    border:1px solid var(--border);color:var(--text);font-size:18px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:.2s}
  #settingsBtn:hover{background:var(--panel2);transform:rotate(45deg)}
  .wrap{max-width:900px;margin:0 auto;padding:80px 20px 60px}
  h1{font-size:28px;margin:0 0 6px;
    background:linear-gradient(90deg,#58a6ff,#a371f7,#f0b132);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--muted);font-size:14px;margin-bottom:24px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:20px;margin-bottom:16px}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px;font-weight:600}
  input[type=text],input[type=password],textarea{
    width:100%;background:#0d1117;color:var(--text);border:1px solid var(--border);
    border-radius:10px;padding:12px 14px;font-size:14px;outline:none;
    font-family:inherit;transition:.2s}
  input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(88,166,255,.15)}
  textarea{min-height:200px;resize:vertical;
    font-family:"JetBrains Mono",Consolas,monospace;font-size:13px;line-height:1.55}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  button.btn{border:none;border-radius:10px;padding:12px 20px;font-size:14px;
    font-weight:700;cursor:pointer;color:#fff;transition:.18s;font-family:inherit}
  button.btn:active{transform:scale(.97)}
  .btn-primary{background:var(--green)}.btn-primary:hover{background:#2ea043}
  .btn-accent{background:#1f6feb}.btn-accent:hover{background:#388bfd}
  .btn-gold{background:#9e6a03}.btn-gold:hover{background:#bb8009}
  .btn-red{background:#b62324}.btn-red:hover{background:#da3633}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
  .btn-ghost:hover{background:var(--panel2)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .result{margin-top:16px;display:none}
  .result.show{display:block}
  .linkBox{display:flex;gap:8px;align-items:center;background:#0d1117;
    border:1px dashed var(--accent);border-radius:10px;padding:12px 14px;
    word-break:break-all;font-family:Consolas,monospace;font-size:12px;color:var(--accent)}
  .linkBox span{flex:1}
  .codeHeader{display:flex;justify-content:space-between;align-items:center;
    flex-wrap:wrap;gap:10px;margin-bottom:14px}
  .codeHeader h2{font-size:20px}
  .stats{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
  .stats b{color:var(--text)}
  pre.code{background:#010409;border:1px solid var(--border);border-radius:10px;
    padding:16px;overflow:auto;max-height:400px;
    font-family:"JetBrains Mono",Consolas,monospace;font-size:13px;line-height:1.55;
    color:#c9d1d9;white-space:pre;tab-size:2}
  .loadBox{margin-top:16px;padding:14px;background:#0d1117;
    border:1px solid var(--green);border-radius:10px;display:none}
  .loadBox.show{display:block}
  .loadBox .out{font-family:Consolas,monospace;font-size:12px;color:#7ee787;
    word-break:break-all;margin-bottom:10px}
  .gate{padding:20px;margin:14px 0;background:#0d1117;
    border:1px solid var(--gold);border-radius:10px}
  .gate h3{font-size:16px;margin-bottom:6px;color:var(--gold)}
  .gate p{font-size:13px;color:var(--muted);margin-bottom:14px}
  .editBox{padding:14px;margin:14px 0;background:#0d1117;
    border:1px solid var(--accent);border-radius:10px}
  .editBox h3{font-size:15px;margin-bottom:6px;color:var(--accent)}
  .editBox textarea{min-height:200px;margin-top:8px}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;
    align-items:center;justify-content:center;z-index:1000;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:22px;width:100%;max-width:440px;animation:pop .18s ease-out;
    max-height:90vh;overflow:auto}
  @keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
  .modal h3{margin-bottom:16px;font-size:18px}
  .group{margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid var(--border)}
  .group:last-of-type{border-bottom:none}
  .langOpts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .langOpts button{position:relative;padding:16px 12px;border-radius:12px;
    border:2px solid var(--border);background:var(--panel2);color:var(--text);
    cursor:pointer;font-size:15px;font-weight:700;font-family:inherit;
    display:flex;flex-direction:column;align-items:center;gap:6px;transition:.18s}
  .langOpts button .flag{font-size:26px}
  .langOpts button:hover{background:#21262d}
  .langOpts button.active{border-color:var(--accent);background:rgba(88,166,255,.12)}
  .langOpts button.active::after{content:'✓';position:absolute;top:6px;right:10px;
    color:var(--accent);font-weight:900}
  .status{margin-top:10px;padding:10px 14px;border-radius:10px;font-size:13px;
    display:flex;align-items:center;gap:8px}
  .status.on{background:rgba(35,134,54,.15);color:#7ee787;border:1px solid rgba(35,134,54,.4)}
  .status.off{background:rgba(139,148,158,.1);color:var(--muted);border:1px solid var(--border)}
  .toast{position:fixed;bottom:24px;left:50%;
    transform:translateX(-50%) translateY(80px);background:var(--panel2);
    border:1px solid var(--border);padding:12px 22px;border-radius:10px;
    font-size:14px;opacity:0;transition:.3s;z-index:2000;pointer-events:none;
    box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.ok{border-color:var(--green);color:#7ee787}
  .toast.err{border-color:var(--red);color:#ff7b72}
  .hidden{display:none !important}
  .lockBadge,.ownerBadge{display:inline-flex;align-items:center;gap:4px;font-size:11px;
    padding:2px 8px;border-radius:999px;margin-left:6px;font-weight:700}
  .lockBadge{background:rgba(240,177,50,.15);color:var(--gold)}
  .ownerBadge{background:rgba(35,134,54,.18);color:#7ee787}
  .note{font-size:12px;color:var(--muted);margin-top:8px}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">Lua<span>Short</span></div>
  <button id="settingsBtn" type="button" title="Settings">⚙️</button>
</div>

<div class="wrap">
  <h1 data-i18n="title">LuaShort</h1>
  <p class="sub" data-i18n="subtitle"></p>

  <div class="card">
    <label data-i18n="lblCode"></label>
    <textarea id="codeInput" data-i18n-ph="phCode"></textarea>
    <div class="row">
      <input type="text" id="customName" data-i18n-ph="phName" style="flex:1;min-width:200px"/>
    </div>
    <div class="row">
      <button class="btn btn-primary" id="genBtn" type="button" data-i18n="btnGen"></button>
      <button class="btn btn-ghost" id="clearBtn" type="button" data-i18n="btnClear"></button>
    </div>

    <div class="result" id="resultBox">
      <label style="margin-top:14px" data-i18n="lblYourLink"></label>
      <div class="linkBox"><span id="shortLink"></span></div>
      <div class="row">
        <button class="btn btn-accent" id="copyLink" type="button" data-i18n="btnCopyLink"></button>
        <button class="btn btn-ghost" id="openLink" type="button" data-i18n="btnOpenCode"></button>
      </div>
    </div>
  </div>

  <div class="card hidden" id="codeCard">
    <div class="codeHeader">
      <h2 data-i18n="lblLuaCode"></h2>
      <div class="stats">
        <span><span data-i18n="lblViews"></span> <b id="viewCount">0</b></span>
        <span data-i18n="lblId"></span> <b id="codeId">-</b></span>
      </div>
    </div>

    <div class="gate hidden" id="gateBox">
      <h3 data-i18n="gateTitle"></h3>
      <p data-i18n="gateSub"></p>
      <input type="password" id="gateInput" data-i18n-ph="phGate" autocomplete="off"/>
      <div class="row">
        <button class="btn btn-gold" id="gateSubmit" type="button" data-i18n="btnUnlock"></button>
      </div>
    </div>

    <div id="codeContent" class="hidden">
      <pre class="code" id="codeDisplay"></pre>

      <div class="editBox hidden" id="editBox">
        <h3 data-i18n="editTitle"></h3>
        <textarea id="editTextarea"></textarea>
        <div class="row">
          <button class="btn btn-primary" id="editSave" type="button" data-i18n="btnSave"></button>
          <button class="btn btn-ghost" id="editCancel" type="button" data-i18n="btnCancel"></button>
        </div>
      </div>

      <div class="row">
        <button class="btn btn-gold" id="loadstringBtn" type="button" data-i18n="btnLoad"></button>
        <button class="btn btn-accent hidden" id="editBtn" type="button" data-i18n="btnEdit"></button>
        <button class="btn btn-ghost" id="closeCodeBtn" type="button" data-i18n="btnClose"></button>
      </div>

      <div class="loadBox" id="loadBox">
        <label data-i18n="lblPaste"></label>
        <div class="out" id="loadOut"></div>
        <button class="btn btn-accent" id="copyLoad" type="button" data-i18n="btnCopyLoad"></button>
      </div>
    </div>
  </div>

  <div class="card">
    <label data-i18n="lblMyLinks"></label>
    <div id="myLinks" style="font-size:14px;color:var(--muted)"></div>
  </div>
</div>

<div class="overlay" id="settingsModal">
  <div class="modal">
    <h3 data-i18n="settingsTitle"></h3>

    <div class="group">
      <label data-i18n="lblLang"></label>
      <div class="langOpts">
        <button type="button" data-lang="en"><span class="flag">🇬🇧</span><span>English</span></button>
        <button type="button" data-lang="th"><span class="flag">🇹🇭</span><span>ไทย</span></button>
      </div>
    </div>

    <div class="group">
      <label data-i18n="pwdSection"></label>
      <div id="pwdStatus" class="status off"></div>
      <div id="pwdSetUI" class="hidden" style="margin-top:12px">
        <input type="password" id="pwdCurrent" data-i18n-ph="pwdCurrent" autocomplete="off"/>
      </div>
      <div style="margin-top:10px">
        <input type="password" id="pwdNew" data-i18n-ph="pwdNew" autocomplete="off"/>
      </div>
      <div class="row">
        <button class="btn btn-primary" id="pwdSave" type="button" data-i18n="btnSavePwd"></button>
        <button class="btn btn-red hidden" id="pwdRemove" type="button" data-i18n="btnRemovePwd"></button>
      </div>
      <p class="note" data-i18n="pwdHint"></p>
    </div>

    <button class="btn btn-ghost" id="closeSettings" type="button" data-i18n="btnClose" style="width:100%"></button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>

  'use strict';

  /* ============ STORAGE ============ */
  const mem = {};
  function lsGet(k,d){
    try{const v=localStorage.getItem(k);return v===null?d:v;}
    catch(e){return mem[k]!==undefined?mem[k]:d;}
  }
  function lsSet(k,v){
    try{localStorage.setItem(k,v);}catch(e){mem[k]=v;}
  }
  function ssGet(k,d){
    try{const v=sessionStorage.getItem(k);return v===null?d:v;}
    catch(e){return d;}
  }
  function ssSet(k,v){
    try{sessionStorage.setItem(k,v);}catch(e){}
  }

  const LS_PWD   = 'luashort_pwd_v1';
  const LS_OWNER = 'luashort_owner_v1';
  const LS_HIST  = 'luashort_hist_v1';
  const LS_LANG  = 'luashort_lang_v1';

  /* ============ I18N ============ */
  const I18N = {
    en:{
      title:'LuaShort',

      // toasts

      createOK:'Link created 🎉',

      copyFail:'Copy failed ❌',

      pwdWrong:'Wrong password ❌',

      needNewPwd:'Please enter new password ❌',

    },
    th:{
      title:'LuaShort',
      subtitle:'วางโค้ด Lua → สร้างลิงค์ (ล็อกด้วยรหัสเดียว) → แชร์',
      lblCode:'📝 โค้ด Lua ของคุณ',
      phCode:'-- Lua script\nprint("hello")',
      phName:'ตั้งชื่อลิงค์ (ไม่ใส่ก็ได้)',
      btnGen:'🔗 สร้างลิงค์',

      btnSave:'💾 บันทึก',
      btnCancel:'ยกเลิก',
      lblPaste:'🎯 คัดลอกไปวางใน Executor',
      btnCopyLoad:'📋 คัดลอก Loadstring',
      lblMyLinks:'📊 ลิงค์ทั้งหมดของคุณ',
      noLinks:'ยังไม่มีลิงค์',
      lockBadge:'🔒 มีรหัส',
      ownerBadge:'👤 ของคุณ',
      settingsTitle:'⚙️ ตั้งค่า',
      lblLang:'🌐 ภาษา',
      pwdSection:'🔐 รหัสผ่านกลาง (ใช้กับทุกโค้ด Lua)',
      pwdCurrent:'ใส่รหัสเดิม',
      pwdNew:'ใส่รหัสใหม่',
      btnSavePwd:'💾 บันทึก',
      btnRemovePwd:'🗑 ลบรหัส',
      pwdHint:'หมายเหตุ: เจ้าของไม่ต้องใส่รหัส / คนอื่นต้องใส่รหัสทุกครั้ง',

      pwdStatusOff:'⚠️ ยังไม่ตั้งรหัส — ใครก็ดูได้',
      editTitle:'✏️ แก้ไขโค้ด Lua',
      // toasts
      needCode:'กรุณาใส่โค้ดก่อน ❌',
      uploading:'⏳ กำลังอัปโหลด...',
      uploadFail:'อัปโหลดไม่สำเร็จ ลองใหม่ ❌',
      createOK:'สร้างลิงค์สำเร็จ 🎉',
      error:'เกิดข้อผิดพลาด ❌',
      copied:'คัดลอกแล้ว ✅',
      copyFail:'คัดลอกไม่สำเร็จ ❌',
      notFound:'ไม่พบโค้ด ❌',
      needPwd:'กรุณาใส่รหัส ❌',

      loadOK:'สร้าง Loadstring สำเร็จ 🎉',
      editOK:'อัปเดตโค้ดสำเร็จ 🎉',
      editFail:'อัปเดตไม่สำเร็จ ❌',

      oldPwdWrong:'รหัสเดิมไม่ถูกต้อง ❌',
      needNewPwd:'กรุณาใส่รหัสใหม่ ❌',
      pwdSaved:'บันทึกรหัสแล้ว ✅',
      pwdRemoved:'ลบรหัสแล้ว',
      notOwner:'คุณไม่ใช่เจ้าของ ❌'
    }
  };

  let LANG = 'en';
  function t(k){
    const d = I18N[LANG] || I18N.en;
    return d[k] || I18N.en[k] || k;
  }

  function applyLang(lang){
    LANG = (lang === 'th') ? 'th' : 'en';
    lsSet(LS_LANG, LANG);
    document.documentElement.lang = LANG;
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      el.textContent = t(el.getAttribute('data-i18n'));
    });
    document.querySelectorAll('[data-i18n-ph]').forEach(function(el){
      el.placeholder = t(el.getAttribute('data-i18n-ph'));
    });
    document.querySelectorAll('.langOpts button').forEach(function(b){
      if (b.getAttribute('data-lang') === LANG) b.classList.add('active');
      else b.classList.remove('active');
    });
    updatePwdStatus();
    renderMyLinks();
    const gen = document.getElementById('genBtn');
    if (gen && !gen.disabled) gen.textContent = t('btnGen');
    // re-render code if visible
    if (currentRecord) {
      document.getElementById('codeDisplay').textContent = currentRecord.code;
      const ed = document.getElementById('editBox');
      if (!ed.classList.contains('hidden')) {
        document.getElementById('editTextarea').value = currentRecord.code;
      }
    }
  }

  /* ============ HASH ============ */
  function hashPwd(s){
    let h = 5381;
    for (let i = 0; i < s.length; i++){
      h = ((h << 5) + h + s.charCodeAt(i)) | 0;
    }
    return 'h' + (h >>> 0).toString(36);
  }

  /* ============ OWNER ID ============ */
  function getOwnerId(){
    let id = lsGet(LS_OWNER, '');
    if (!id){
      id = 'o_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
      lsSet(LS_OWNER, id);
    }
    return id;
  }

  /* ============ RECORD STORAGE (jsonblob + fallback) ============ */
  const API = 'https://jsonblob.com/api/jsonBlob';

  async function createRecord(rec){
    try {
      const res = await fetch(API, {
        method: 'POST',
        headers: {'Content-Type':'application/json','Accept':'application/json'},
        body: JSON.stringify(rec)
      });
      if (res.ok){
        const loc = res.headers.get('Location') || '';
        const id = loc.split('/').pop();
        if (id) return {id, inline:false};
      }
    } catch(e){}
    // fallback inline
    const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(rec))));
    return {id:'i_'+b64, inline:true};
  }

  async function readRecord(id){
    if (id.indexOf('i_') === 0){
      try {
        const json = decodeURIComponent(escape(atob(id.slice(2))));
        const r = JSON.parse(json);
