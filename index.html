<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loadstring</title>
<style>
body{font-family:sans-serif;background:#111;color:#eee;margin:0;padding:16px}
.c{max-width:500px;margin:0 auto}
.h{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
h1{font-size:1.2rem;margin:0}
.g{background:#2a2a2a;border:0;color:#fff;font-size:1.2rem;width:42px;height:42px;border-radius:50%;cursor:pointer}
.b{background:#1e1e1e;padding:20px;border-radius:12px}
input{width:100%;padding:12px;border-radius:8px;border:1px solid #444;background:#2a2a2a;color:#fff;font-size:1rem;box-sizing:border-box}
.m{width:100%;margin-top:12px;padding:12px;border:0;border-radius:8px;background:#4f46e5;color:#fff;font-size:1rem;cursor:pointer}
.m:disabled{background:#333}
#r{margin-top:16px;padding:12px;background:#000;border-radius:8px;font-family:monospace;word-break:break-all;white-space:pre-wrap;min-height:50px;font-size:.9rem}
.l{color:#facc15}
.cp{width:100%;margin-top:8px;padding:10px;border:1px solid #4f46e5;border-radius:8px;background:transparent;color:#8b85ff;font-size:.95rem;cursor:pointer;display:none}
.cp.s{display:block}
.cp.d{background:#4f46e5;color:#fff}
.ht{margin:24px 0 8px;font-size:1rem;color:#aaa}
.hi{background:#1e1e1e;padding:10px 12px;border-radius:8px;font-family:monospace;font-size:.8rem;word-break:break-all;border-left:3px solid #4f46e5;margin-bottom:8px}
.hi span{display:block;color:#666;font-size:.7rem;margin-top:4px;font-family:sans-serif}
.e{color:#555;font-size:.85rem;text-align:center;padding:12px}
.md{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);justify-content:center;align-items:center;padding:20px;z-index:100}
.md.s{display:flex}
.mc{background:#1e1e1e;padding:20px;border-radius:12px;width:100%;max-width:400px}
.mc h2{margin:0 0 16px;font-size:1.1rem}
.mc button{width:100%;padding:14px;border-radius:8px;border:0;font-size:1rem;cursor:pointer;background:#dc2626;color:#fff}
</style>
</head>
<body>
<div class="c">
<div class="h"><h1>สร้าง Loadstring</h1><button class="g" id="g">⚙️</button></div>
<div class="b">
<input id="i" placeholder="ใส่คำอะไรก็ได้...">
<button class="m" id="btn">สร้าง</button>
<div id="r">ผลลัพธ์จะแสดงที่นี่</div>
<button class="cp" id="cp">📋 คัดลอก</button>
</div>
<div class="ht">📜 ประวัติที่เคยสร้าง</div>
<div id="hl"><div class="e">ยังไม่มีประวัติ</div></div>
</div>
<div class="md" id="md"><div class="mc">
<h2>⚙️ ตั้งค่า</h2>
<button id="cl">🗑️ ล้างประวัติทั้งหมด</button>
</div></div>
<script>
var i=document.getElementById('i'),btn=document.getElementById('btn'),r=document.getElementById('r'),cp=document.getElementById('cp'),hl=document.getElementById('hl'),g=document.getElementById('g'),md=document.getElementById('md'),cl=document.getElementById('cl'),cur='';
function gh(){try{return JSON.parse(localStorage.getItem('ls_h')||'[]')}catch(e){return[]}}
function sh(l){localStorage.setItem('ls_h',JSON.stringify(l))}
function rh(){var l=gh();if(!l.length){hl.innerHTML='<div class="e">ยังไม่มีประวัติ</div>';return}hl.innerHTML=l.map(function(x){return '<div class="hi">loadstring(game:HttpGet("'+x.t+'"))()<span>'+x.d+'</span></div>'}).join('')}
function gen(){var t=i.value.trim();if(!t){r.className='';r.textContent='กรุณาใส่คำก่อน';cp.classList.remove('s');return}
btn.disabled=true;r.className='l';r.textContent='กำลังประมวลผล...';cp.classList.remove('s');
setTimeout(function(){var s=JSON.stringify(t).slice(1,-1);cur='loadstring(game:HttpGet("'+s+'"))()';r.className='';r.textContent=cur;btn.disabled=false;cp.classList.add('s');cp.classList.remove('d');cp.textContent='📋 คัดลอก';
var h=gh();h.unshift({t:s,d:new Date().toLocaleString('th-TH')});sh(h.slice(0,20));rh()},2000)}
cp.onclick=function(){var done=function(){cp.classList.add('d');cp.textContent='✅ คัดลอกแล้ว!';setTimeout(function(){cp.classList.remove('d');cp.textContent='📋 คัดลอก'},1500)};
if(navigator.clipboard){navigator.clipboard.writeText(cur).then(done).catch(function(){fb(done)})}else{fb(done)}};
function fb(cb){var ta=document.createElement('textarea');ta.value=cur;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);cb()}
g.onclick=function(){md.classList.add('s')};
md.onclick=function(e){if(e.target===md)md.classList.remove('s')};
cl.onclick=function(){if(confirm('แน่ใจนะว่าจะล้างประวัติทั้งหมด?')){sh([]);rh();md.classList.remove('s')}};
btn.onclick=gen;
i.onkeydown=function(e){if(e.key==='Enter')gen()};
rh();
</script>
</body>
  </html>
