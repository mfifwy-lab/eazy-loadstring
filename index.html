<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loadstring Generator</title>
  <style>
    body { font-family: sans-serif; background: #111; color: #eee; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    .box { background: #1e1e1e; padding: 24px; border-radius: 12px; width: 100%; max-width: 500px; box-shadow: 0 0 20px rgba(0,0,0,0.6); }
    h1 { font-size: 1.4rem; text-align: center; margin-bottom: 16px; }
    input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #2a2a2a; color: #fff; font-size: 1rem; }
    button { width: 100%; margin-top: 12px; padding: 12px; border: none; border-radius: 8px; background: #4f46e5; color: #fff; font-size: 1rem; cursor: pointer; }
    button:disabled { background: #333; cursor: not-allowed; }
    #result { margin-top: 20px; padding: 12px; background: #000; border-radius: 8px; font-family: monospace; word-break: break-all; white-space: pre-wrap; min-height: 50px; }
    .loading { color: #facc15; }
  </style>
</head>
<body>
  <div class="box">
    <h1>สร้าง Loadstring</h1>
    <input id="inputText" type="text" placeholder="ใส่คำอะไรก็ได้..." />
    <button id="btn">สร้าง</button>
    <div id="result">ผลลัพธ์จะแสดงที่นี่</div>
  </div>
  <script>
    const input = document.getElementById('inputText');
    const btn = document.getElementById('btn');
    const result = document.getElementById('result');
    function generate() {
      const text = input.value.trim();
      if (!text) { result.className = ''; result.textContent = 'กรุณาใส่คำก่อน'; return; }
      btn.disabled = true; result.className = 'loading'; result.textContent = 'กำลังประมวลผล...';
      setTimeout(() => {
        const safeText = JSON.stringify(text).slice(1, -1);
        result.className = ''; result.textContent = `loadstring(game:HttpGet("${safeText}"))()`;
        btn.disabled = false;
      }, 2000);
    }
    btn.addEventListener('click', generate);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') generate(); });
  </script>
</body>
</html>
